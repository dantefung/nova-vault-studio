<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__KNOWLEDGE_MAP_TITLE__</title>
<style>
:root{color-scheme:light dark;--bg:#f5f3ed;--ink:#20231f;--muted:#6b7068;--panel:#fffdf8;--line:#d8d7d0;--static:#277a53;--dynamic:#c86922;--map:#7657b5;--feedback:#c74444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}header{padding:28px clamp(20px,5vw,64px) 18px;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:clamp(26px,4vw,48px);line-height:1.08}.thesis{max-width:900px;color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:999px;padding:8px 14px;cursor:pointer}button.active{background:var(--ink);color:var(--bg)}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px clamp(16px,4vw,48px) 40px}.map{display:grid;gap:16px}.zone{border:1px dashed;padding:18px;border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent)}.zone.static{border-color:var(--static)}.zone.dynamic{border-color:var(--dynamic)}.zone h2{margin:0 0 14px}.nodes,.track{display:flex;gap:12px;flex-wrap:wrap}.track{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.track-label{width:100%;font-weight:700}.node{width:min(260px,100%);padding:12px;border:1px solid var(--line);border-left:4px solid var(--static);border-radius:10px;background:var(--panel);cursor:pointer}.dynamic .node{border-left-color:var(--dynamic)}.node b{display:block;margin-bottom:5px}.node small{color:var(--muted)}.node.dim{opacity:.18}.node.selected{outline:3px solid color-mix(in srgb,var(--map) 55%,transparent)}aside{position:sticky;top:18px;align-self:start;min-height:220px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}aside h2{margin-top:0}.relations{margin-top:16px}.relation{padding:9px 0;border-top:1px solid var(--line)}.mapping{color:var(--map)}.feedback{color:var(--feedback)}body[data-filter=static] .dynamic,body[data-filter=dynamic] .static{display:none}body[data-filter=mapping] .node:not(.connected){display:none}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:static}}@media(prefers-color-scheme:dark){:root{--bg:#171a17;--ink:#f1f0e9;--muted:#aaaFA8;--panel:#202420;--line:#3d423d}}
</style>
</head>
<body data-filter="all">
<header><h1 id="title"></h1><div class="thesis" id="thesis"></div><nav id="filters"></nav></header>
<main><section class="map"><section class="zone static"><h2>静态知识树</h2><div class="nodes" id="static"></div></section><section class="zone dynamic"><h2>动态方法轨道</h2><div id="dynamic"></div></section></section><aside id="detail"><h2>知识地图</h2><p>点击节点查看摘要和一跳关联。</p></aside></main>
<script>const model=__KNOWLEDGE_MAP_DATA__;const $=s=>document.querySelector(s);const all=[...model.staticTree.nodes,...model.dynamicFlow.activities];const byId=Object.fromEntries(all.map(n=>[n.id,n]));const rel=[...model.crossMapping,...model.feedbackLoop];const relationIds=new Set(rel.flatMap(r=>[r.source,r.target]));$('#title').textContent=model.meta.title;$('#thesis').textContent=model.meta.thesis;const filters=[['all','全部'],['static','仅静态'],['dynamic','仅动态'],['mapping','仅映射']];filters.forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.className=key==='all'?'active':'';b.onclick=()=>{document.body.dataset.filter=key;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.node').forEach(x=>{x.classList.remove('dim','selected');x.classList.toggle('connected',key==='mapping'&&relationIds.has(x.dataset.id))})};$('#filters').append(b)});function card(n){const el=document.createElement('article');el.className='node';el.dataset.id=n.id;el.innerHTML=`<b>${n.id} · ${escapeHtml(n.name)}</b><small>${escapeHtml(n.summary)}</small>`;el.onclick=()=>select(n.id);return el}model.staticTree.nodes.forEach(n=>$('#static').append(card(n)));model.dynamicFlow.tracks.forEach(t=>{const wrap=document.createElement('div');wrap.className='track';wrap.innerHTML=`<div class="track-label">${escapeHtml(t.name)}</div>`;t.activities.forEach(id=>wrap.append(card(byId[id])));$('#dynamic').append(wrap)});function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function select(id){const linked=rel.filter(r=>r.source===id||r.target===id);const ids=new Set([id,...linked.flatMap(r=>[r.source,r.target])]);document.querySelectorAll('.node').forEach(el=>{el.classList.toggle('selected',el.dataset.id===id);el.classList.toggle('dim',!ids.has(el.dataset.id));el.classList.toggle('connected',ids.has(el.dataset.id))});const n=byId[id];$('#detail').innerHTML=`<h2>${escapeHtml(n.name)}</h2><p>${escapeHtml(n.summary)}</p><div class="relations">${linked.length?linked.map(r=>{const other=byId[r.source===id?r.target:r.source];return `<div class="relation ${r.kind}"><b>${r.kind==='mapping'?'映射':'反馈'}</b><br>${escapeHtml(other.name)} · ${escapeHtml(r.reason)}</div>`}).join(''):'<div class="relation">暂无跨线关系</div>'}</div>`}document.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('button'))document.querySelectorAll('.node').forEach(el=>el.classList.remove('dim','selected'))});</script>
</body>
</html>
