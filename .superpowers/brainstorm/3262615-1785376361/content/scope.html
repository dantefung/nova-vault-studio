<h2>首页改造边界</h2>
<p class="subtitle">请选择你希望我改造的范围</p>

<div class="options">
  <div class="option" data-choice="homepage-only" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>只改首页</h3>
      <p>首页采用 EastonDev 风格，文章页、侧边栏、搜索和现有导航保持不变。风险最低，推荐先做这个。</p>
    </div>
  </div>
  <div class="option" data-choice="site-wide" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>首页 + 全站外观</h3>
      <p>首页、全局导航、文章页、目录页一起统一成目标站的视觉语言。效果完整，但改动更大。</p>
    </div>
  </div>
  <div class="option" data-choice="content-first" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>首页结构借鉴，视觉重新设计</h3>
      <p>借鉴目标站的信息组织方式，但以知识库内容为中心重新设计，不追求像素级复刻。</p>
    </div>
  </div>
</div>
