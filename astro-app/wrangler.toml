# Cloudflare 部署配置（Workers Static Assets）
#
# 用法（Workers 方式，推荐）：
#   cd astro-app && npx wrangler deploy
#
# 用法（Cloudflare Pages 方式）：
#   在 Pages 项目里配置：
#     - 构建命令：cd astro-app && npm run build
#     - 构建输出目录：astro-app/dist
#     - 环境变量：NODE_VERSION=22
#     - HTML 处理：默认 auto-trailing-slash 即可（产物是 .html 文件形态，
#       与 VitePress 时期一致，/md/wiki/sources/foo 直接命中 foo.html）
#
# 为什么不走 Pages 的默认目录索引：产物里普通页面是 .html、目录索引页是
# index.html，与 VitePress 时期一致，Cloudflare 的 auto-trailing-slash
# 会把 /md/wiki/sources/foo 直接命中 foo.html，无需任何跳转。

name = "system-vault"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 产物目录：astro build 之后由 integrations/copy-md-assets.mjs 直写静态资源
[assets]
directory = "./dist"
binding = "SYSTEM_VAULT_ASSETS"

# 静态站没有运行时函数，纯静态分发
[observability]
enabled = false

# 环境变量说明：
#   NODE_VERSION=22
#     Astro 5 的 engines 要求 ^18.20.8 || ^20.3.0 || >=22.0.0，
#     Cloudflare Pages 默认 Node 18.x，必须在项目设置里显式指定 22。
#
# 构建耗时参考：本地 45–90 秒（其中大部分是 843MB 静态资源写入），
# Cloudflare Pages 单次构建上限 10 分钟，留足余量。
