# Cloudflare 部署配置
#
# 用于 Cloudflare Pages：
#   cd astro-app && npx wrangler pages deploy
# 或在 Pages 项目设置里填：
#   - 构建命令：cd astro-app && npm run build
#   - 输出目录：astro-app/dist
#   - 环境变量：NODE_VERSION=22（Astro 5 要求 >=18.20.8，CF 默认 18.x 必须显式指定）
#
# 说明：Pages 与 Workers 是两套互斥的配置形态（pages_build_output_dir vs [assets]）。
# 本文件按 Pages 形态写，因为站点是纯静态产物，Pages 的静态托管 +
# 全量 CDN 缓存正是这个规模（1.1GB / 1.4 万文件）需要的。
#
# 如果改用 Workers Static Assets：
#   1) 删掉下面的 pages_build_output_dir
#   2) 换成：
#        [assets]
#        directory = "./dist"
#        binding = "SYSTEM_VAULT_ASSETS"
#   3) 构建产物仍由 integrations/copy-md-assets.mjs 在 astro:build:done 直写 dist/
#
# HTML 处理：保持默认 auto-trailing-slash 即可。
# 产物形状与 VitePress 时期一致（普通页面 foo.html、目录索引页 foo/index.html），
# /md/wiki/sources/foo 直接命中 foo.html，/md/wiki/ 命中 wiki/index.html，无需任何跳转。

name = "nova-vault"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./dist"

# 站内没有运行时函数，纯静态分发
[observability]
enabled = false
