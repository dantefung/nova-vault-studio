      - generic [ref=f6e55]:
        - generic [ref=f6e56]:
          - heading "出海工具网站，从需求挖掘到网站制作全流程，让你一篇文章学会" [level=1] [ref=f6e58]
          - generic [ref=f6e59]:
            - img "e3d49c46b0ea72066fcb44eba7495108.jpg" [ref=f6e61]
            - generic [ref=f6e62]: 大家好，我是哥飞，今天给大家聊聊一个出海工具网站，如何从需求挖掘到网站制作全流程，让你一篇文章学会。
            - generic [ref=f6e63]: 今天给大家带来的分享主要分为四个部分：
            - generic [ref=f6e64]: 一、海外工具站的发展前景
            - generic [ref=f6e65]: 二、怎么挖掘需求
            - generic [ref=f6e66]: 三、实战一下挖掘需求
            - generic [ref=f6e67]: 四、怎么制作工具站
            - heading "一、海外工具站的发展前景" [level=2] [ref=f6e68]
            - generic [ref=f6e69]: 我们先说一下海外工具站的发展前景。
            - generic [ref=f6e70]: 工具站做好了，排名上去了，几乎就可以吃十年二十年收益。
            - generic [ref=f6e71]: 只要还有互联网，只要还有搜索引擎，只要还有互联网广告，你就还会有收入。
            - generic [ref=f6e72]: 而且一个网站存活得越久，在互联网上留下的外链就会越多，那么排名就会越稳固。
            - generic [ref=f6e73]: 当然，这有一个前提，你不能做垃圾站，赚钱的前提一定是你做的工具能够切切实实帮助到别人，用户才会自发地帮助你传播。
            - generic [ref=f6e74]: 种一棵树最好的时间是十年前，其次是现在。
            - generic [ref=f6e75]: 做网站属于长期积累的事情，所以不要想着等以后再做，而应该立即开始去做。
            - generic [ref=f6e76]: 做好了，放在那里不去更新，只要你的工具站还有人使用，权重就会日积月累，越来越高。
            - generic [ref=f6e77]: 尤其今年一整年，大家对于AI的热情都很高涨，只要我们做的工具跟AI相关，用户就会自发帮助我们传播。
            - generic [ref=f6e78]: 所以可以说，现在是最好的下场时期。
            - generic [ref=f6e79]: 可以做的方向有很多，有些需求是短期的，有些是长期的，有些是for fun为了好玩的，有些是真的工作生活需要用到的。
            - generic [ref=f6e80]: 对于我们大多数新手来说，可以先做短期的或者for fun的需求练练手，在这个过程中学习如何挖掘需求，如何做SEO，如何获取流量，如何宣传推广，如何将流量变现。
            - generic [ref=f6e81]: 之后就可以布局长期的、工作生活需要的一些工具，参考竞争对手，争取在某些方面超过竞争对手，如做得更好用，做得更漂亮，做得处理速度更快等等。
            - heading "二、怎么挖掘需求" [level=2] [ref=f6e82]
            - generic [ref=f6e83]: 接下来我们聊一下怎么挖掘需求
            - generic [ref=f6e84]: 利用 Semrush、Similarweb、ahrefs、Google Trends 等工具挖掘需求，判断是否值得做。
            - generic [ref=f6e85]: 这些工具一般用免费功能就行，如果你想用付费功能，直接买正版比较贵，可以去淘宝找找便宜的共享账号。
            - heading "2.1、我们先说下 Similarweb" [level=3] [ref=f6e86]
            - generic [ref=f6e87]: Similarweb可以用来查看网站流量、流量来源渠道、流量地域分布等，还可以看到相似网站。
            - generic [ref=f6e88]:
              - text: 网址：
              - link "https://www.similarweb.com/zh/" [ref=f6e89] [cursor=pointer]:
                - /url: https://www.similarweb.com/zh/
            - generic [ref=f6e90]:
              - text: 插件：
              - link "https://chrome.google.com/webstore/detail/similarweb-traffic-rank-w/hoklmmgfnpapgjgcpechhaamimifchmp" [ref=f6e91] [cursor=pointer]:
                - /url: https://chrome.google.com/webstore/detail/similarweb-traffic-rank-w/hoklmmgfnpapgjgcpechhaamimifchmp
            - generic [ref=f6e92]: 建议养成好习惯，没事就去搜索引擎搜索一些工具相关词汇，对于搜索结果排名前10的网站，都可以去看看流量到底有多少。
            - generic [ref=f6e93]: 举例在谷歌搜索“pdf”，排名第一的是adobe官网，第二就是 ilovepdf.com ，那么就可以打开 Similarweb 查看流量。
            - img "image.png" [ref=f6e95]
            - generic [ref=f6e96]: 这里访问量单位M表示100万，8.8M是880万，138.8M就是一亿三千八百八十万。
            - generic [ref=f6e97]: 跳出率只有20%不到，说明大家打开之后，都能够找到自己所需要的工具，说明的确是有用的工具。
            - generic [ref=f6e98]: 如果跳出率太高，就说明进来的人打开当前页面后，没有点击其它页面就关闭了当前页面。
            - generic [ref=f6e99]: 这种情况，要么是网站打开太慢，要么是垃圾站，满足不了搜索进来的用户的需求。
            - generic [ref=f6e100]: 每次访问页数和访问时长也说明了这个工具站是能够满足用户需求的。
            - img "6731c5e03824b4f56ff612dcade0b260.jpg" [ref=f6e102]
            - generic [ref=f6e103]: 看上图，流量还是很分散的，各个国家都有。不过有些国家看起来是空白，大家可以去研究一下。
            - generic [ref=f6e104]: 还可以看到很多类似网站，每一个网站的流量数据都展示出来了，我们可以点进每一个网站去看具体的数据。
            - img "2b74f5b8faf3e8c61616d46f3a49a0d7.jpg" [ref=f6e106]
            - generic [ref=f6e107]: 所以相当于，你只需要在谷歌找到一个网站，就能够顺藤摸瓜，找到很多网站。
            - img "image.png" [ref=f6e109]
            - generic [ref=f6e110]: 64.6%流量来自于搜索引擎，那就说明这个网站SEO真的做得好很好。
            - generic [ref=f6e111]: 同时又不是90%来自于搜索引擎，还有31.3%是直接访问的。
            - generic [ref=f6e112]: 这就是说明，这个网站能够把从搜索引擎过来的新用户转变为老用户。
            - generic [ref=f6e113]: 用户要么记住网址了，要么加入书签了。
            - generic [ref=f6e114]: 又再次印证了我们之前说的，这个网站用户体验做得好，能够满足用户需求。
            - img "2e5b75badb8a8aa2334a2de9578a5d39.jpg" [ref=f6e116]
            - generic [ref=f6e117]: 这里可以看到用户都是搜索哪些关键词进来的，可以看到品牌词就有850万，也说明这个品牌深入人心了。
            - img "d5633041604b8df9bd346355dc08101e.jpg" [ref=f6e119]
            - img "a7c494fbca6d640f6ffe565d68319ddd.jpg" [ref=f6e121]
            - img "d81baf5c3765fe7763c5a6a2629baf58.jpg" [ref=f6e123]
            - generic [ref=f6e124]:
              - text: 如
              - link "https://presearch.com/" [ref=f6e125] [cursor=pointer]:
                - /url: https://presearch.com/
              - text: ，打开就发现，每个月有890万访问量，也很大了。看介绍，这是一个去中心化的搜索引擎，哥飞也是第一次知道这个网站。那么对于一个新网站，我们就可以按照研究 ilovepdf.com 一样，再去研究一下，说不定又会有新发现。
            - generic [ref=f6e126]: 我们常说上网是冲浪，在互联网的海洋里遨游，那么具体怎么游，就看你会不会用这些工具了，工具用得好，眼界宽不少。
            - generic [ref=f6e127]: Similarweb 就先给大家介绍这么多了，以上这些功能，甚至都不需要登录就能够看到。
            - heading "2.2、接下来我们说说 Semrush" [level=3] [ref=f6e128]
            - generic [ref=f6e129]: 可以用来查看网站搜索流量，搜索关键词分布，查看每个关键词流量大小，判断关键词优化难度，查看入站外链和出站域名等，功能很多。
            - generic [ref=f6e130]:
              - text: 网址：
              - link "https://zh.semrush.com/projects/" [ref=f6e131] [cursor=pointer]:
                - /url: https://zh.semrush.com/projects/
            - img "c0be1358c7deba3b99243457006d7536.jpg" [ref=f6e133]
            - generic [ref=f6e134]: 使用方式很简单，依然是把域名输入进去，提交搜索后就能看到结果页面。
            - generic [ref=f6e135]: 这里可以看到自然搜索流量有多少，付费搜索流量有多少，反链有多少。还可以看到按照国家分布的搜索流量。
            - generic [ref=f6e136]: 我们点击上面的114.3M，就能看到这个站在各个国家的搜索关键字流量来源。
            - img "92f1513b6d0f1f465abd1391faee21c8.jpg" [ref=f6e138]
            - generic [ref=f6e139]: 注意看KD那一列，代表的就是这个词在这个国家的优化竞争度，数字越高竞争度越高，我们几乎无法竞争过去。
            - generic [ref=f6e140]: 免费版本无法按照KD难度筛选关键字，如果是VIP账号的话，我们可以筛选KD值60以下的词，按照搜索量从高到低排序，就有可能能够挖掘到一些有一定搜索量，但是竞争难度不高的词。
            - img "3a947c5352a333b8df222ade2cefe6a6.jpg" [ref=f6e142]
            - generic [ref=f6e143]: 每个关键字都点击打开新页面，可以看到这个关键字的搜索量，优化竞争度，排名前几的结果。
            - generic [ref=f6e144]: 类似于 seword 这种别人品牌词的，直接略过，不建议继续去看。
            - img "d5fe44c0a721b54e1cd519468846f7c9.jpg" [ref=f6e146]
            - generic [ref=f6e147]: 哥飞去找了一下，发现一个词“poxer”，竞争难度很低，下面的搜索结果也都是内页。
            - generic [ref=f6e148]: 那么如果我们注册一个相关域名，举全站之力去优化这个词，很容易就能够上谷歌首页。
            - img "e51fb852c00cf4e8bcb66864074c1409.jpg" [ref=f6e150]
            - generic [ref=f6e151]: 注意，“monkey pox”表示“猴痘”，“pox”表示“痘”，所以“poxer”有可能用户想了解的是患了“痘”的人相关信息。
            - generic [ref=f6e152]: 当然，具体用户到底想找的是什么，就需要更深入地去挖掘了。
            - generic [ref=f6e153]: Semrush 功能很多，很强大，我们今天就只介绍以上看域名和看关键字两个功能，剩下更多功能，大家自己去探索。
            - heading "2.3、接下来我们聊下Google Trends" [level=3] [ref=f6e154]
            - generic [ref=f6e155]: 可以用来判断流量趋势，判断多个关键字流量相对大小。
            - generic [ref=f6e156]:
              - text: 网址：
              - link "https://trends.google.com/trends/" [ref=f6e157] [cursor=pointer]:
                - /url: https://trends.google.com/trends/
            - img "ab7faf8e899570f7e64fce6e219caa83.jpg" [ref=f6e159]
            - img "326f358e0bde7193d53bedea88339760.jpg" [ref=f6e161]
            - generic [ref=f6e162]: 从上面两个词对比就可以看出来，有些词的搜索量是有周期性的，如母亲节，只在每年的母亲节前后搜索量高，之后全年都很低。但是“poxer”则一年都很平稳。
            - heading "2.4、我们再看下 ahrefs" [level=3] [ref=f6e163]
            - generic [ref=f6e164]: ahrefs 功能也很强大，很多功能，我们今天只介绍免登录就可以使用的一个小工具，判断关键字优化难度
            - generic [ref=f6e165]:
              - text: 网址：
              - link "https://ahrefs.com/keyword-difficulty" [ref=f6e166] [cursor=pointer]:
                - /url: https://ahrefs.com/keyword-difficulty
            - generic [ref=f6e167]: 输入要查询的词，选择要查询的国家，点击check按钮，就可以查询了。
            - img "458a43359cbc4951d7a2d7da416e3542.jpg" [ref=f6e169]
            - generic [ref=f6e170]: 在这个结果页面，我们主要关注难度和外链数据。从页面可以看到，竞争难度95，需要1391个外链网站才有可能能排上谷歌美国搜索的前10。
            - generic [ref=f6e171]: 通常，如果所需要的外链网站数量小于100，我们都可以去尝试一下。
            - img "eed29215633f88a83bf9504f589a0ec7.jpg" [ref=f6e173]
            - generic [ref=f6e174]: 刚才我们在Similarweb查看 ilovepdf 的流量也发现，在美国几乎没流量，从上图的搜索结果列表也可以看出来，ilovepdf就没有上榜。
            - generic [ref=f6e175]:
              - text: 在前10可以看到
              - link "https://www.freepdfconvert.com/，大家可以当作作业，去分析一下这个站。" [ref=f6e176] [cursor=pointer]:
                - /url: https://www.freepdfconvert.com/%EF%BC%8C%E5%A4%A7%E5%AE%B6%E5%8F%AF%E4%BB%A5%E5%BD%93%E4%BD%9C%E4%BD%9C%E4%B8%9A%EF%BC%8C%E5%8E%BB%E5%88%86%E6%9E%90%E4%B8%80%E4%B8%8B%E8%BF%99%E4%B8%AA%E7%AB%99%E3%80%82
            - img "fe3ed8fd1c7cc28d8917c297ed0b776d.jpg" [ref=f6e178]
            - generic [ref=f6e179]: 以“poxer”为例，查询结果显示难度为0，也就是说这是一个没人关注的小词新词，所以很容易就能优化上去。
            - generic [ref=f6e180]: 好了，我们常用的工具到这里就介绍完了。
            - generic [ref=f6e181]: 我们最后再总结一下，我们可以通过在搜索引擎查询一些工具相关的词汇，找到一些网站，然后去 Similarweb 查询网站流量，流量渠道，相关网站等信息。之后再用 Semrush 去分析网站、分析关键字，找到竞争难度低的词，再去 ahrefs这里再验证一下。
            - generic [ref=f6e182]: 其实也不一定只看工具站，我们可以去查我们知道的任意一个有一定流量的网站，分析网站流量来自于哪些关键字，之后分析一下，有没有哪个关键字是我们可以去做的。
            - heading "三、实战一下挖掘需求" [level=2] [ref=f6e183]
            - generic [ref=f6e184]: 接下来我们实战一下，实战之前，先给大家看一个老外发到 reddit 上的帖子，关于他如何花了2000美元建站，半年多之后，就每个月有1000美元左右收入的故事。
            - link "https://www.reddit.com/r/juststart/comments/mcaodn/how_i_built_a_site_for_less_than_2000_which_now/" [ref=f6e186] [cursor=pointer]:
              - /url: https://www.reddit.com/r/juststart/comments/mcaodn/how_i_built_a_site_for_less_than_2000_which_now/
            - img "7a1dba22d9061c1c1bf8c446aa7d228a.jpg" [ref=f6e188]
            - img "6cc28fe7850ed0a7f05729822374c383.jpg" [ref=f6e190]
            - generic [ref=f6e191]: 这个方法在 Semrush 中也可以使用，哥飞带大家实际试用一下。
            - generic [ref=f6e192]: 打开 Keyword Magic Tool，随便输入一些词，这里我选择了猫猫狗狗这些常见的词，选择KD（竞争度）0～29%，也就是低竞争度，排除一些色情词汇，然后一个一个去看，就给我发现了“cat coloring pages” 这个词，竞争度只有27，而且搜索结果前6都是内页，那么我们注册一个域名来优化这个词，就很容易排到谷歌搜索首页。
            - img "17cf9d4a85290b95284a94069fcb8e96.jpg" [ref=f6e194]
            - img "4b155d2f6e4aa7ab3059e14627d8c37c.jpg" [ref=f6e196]
            - generic [ref=f6e197]: 这里解释一下，对于同一个关键字，一般来讲，
            - generic [ref=f6e198]: 域名权重大于子域名，
            - generic [ref=f6e199]: 子域名大于子目录，
            - generic [ref=f6e200]: 子目录大于内页。
            - generic [ref=f6e201]: 所以对于一个竞争度比较低的关键词，而谷歌搜索前几个都是内页的情况下，那么我们注册一个域名，专门去优化这个词，那么很容易排到谷歌搜索第一页。
            - generic [ref=f6e202]:
              - text: 再在
              - link "https://ahrefs.com/keyword-difficulty" [ref=f6e203] [cursor=pointer]:
                - /url: https://ahrefs.com/keyword-difficulty
              - text: 这里验证一下，优化难度9，只需要10个外链就能排到首页，说明的确值得去做。
            - img "5df91dc59840161221f33794170fd057.jpg" [ref=f6e205]
            - generic [ref=f6e206]: 既然cat可以，dog是否也可以呢，flower是否可以呢？大家可以发散思维，找到更多词。
            - generic [ref=f6e207]: 用 coloring pages 去搜索下，找到很多相关词，不过有一些词竞争难度比较大。
            - img "0b8b7ca1e5930a4ed1a87fd1a4ba2f30.jpg" [ref=f6e209]
            - generic [ref=f6e210]: 如果我们要做一个网站来满足这些词的搜索需求，要怎么做呢？
            - generic [ref=f6e211]: 首先注册一个合适的域名，前面我们讲过，域名带上AI，会让我们的推广事半功倍，所以可以用 ai-coloring-pages.com 这个域名，完美符合关键字，也增加了AI元素。
            - img "e98cf6a6c86f514fc68d94b0f0034c6e.jpg" [ref=f6e213]
            - generic [ref=f6e214]: 此时此刻，这个域名是可以注册的，看看谁手速快。
            - generic [ref=f6e215]: 然后我们分析需求，用户一般都是为了找到喜欢的黑白着色线框图下载下来打印出来用于填色。
            - generic [ref=f6e216]: 那么我们就需要在网站上放很多已经生成好的线框图，让用户可以分门别类的查找，也最好在网站上直接集成AI画图能力，用户输入简单的词汇，如 dog、cat等，你后台就可以生成合适的prompt，去帮助用户生成图片，显示到网站上。
            - generic [ref=f6e217]: 所有生成的图片，都公开给所有用户可见，这样你的网站就会有源源不断地产生新的图片，而不需要你去手动维护更新。
            - generic [ref=f6e218]: 除了放广告赚钱，有没有可能收费呢？也是可以的，既然用户的需求是下载图片，那么你就可以在下载时做文章。不注册只能下载有限张图片，注册后可以下载多张图片，但是如果订阅之后，就可以批量下载图片，还可以把多张图片合并成一个pdf供用户下载。
            - generic [ref=f6e219]: 刚才说了，我们最好用图片站的方式来做，那么图片就要用大图，刚好用户下载下来是用于打印的，那么你就可以把所有图片都做出标准A4纸大小，让用户下载下来就可以直接拿去打印。
            - generic [ref=f6e220]: 然后给每张图片的alt都写上合适的描述，让用户能够在图片搜索时找到你的图片，进而打开你的网页。
            - img "087b083decfdc0b65fbda2b6768b7c03.jpg" [ref=f6e222]
            - generic [ref=f6e223]: 我们的目标是让我们的图片出现在红色大框位置。
            - generic [ref=f6e224]: 而通过在网页里放置大图，且给每张图片写上契合的 alt ，就可以让爬虫能够看懂图片，从而收录我们的图片，最终显示在这个位置。
            - generic [ref=f6e225]: 搜索结果右侧的红色小框里的图，也是网页里有图片，一般就会显示出来。
            - generic [ref=f6e226]: 好了，上面实战部分就结束了。
