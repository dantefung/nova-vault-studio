    </rect>
    <rect x="350" y="690" width="224" height="38" rx="6" fill="#148a85">
    </rect>
    <text x="601" y="718" fill="#116b68" font-size="23" font-weight="700">
     
     
     
     剩余 24.9%
    </text>
    <rect x="1300" y="685" width="188" height="48" rx="6" fill="#fff0eb">
    </rect>
    <text x="1394" y="717" fill="#c44d32" font-size="24" font-weight="700" text-anchor="middle">
     
     
     
