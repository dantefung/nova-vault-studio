    <rect x="1300" y="587" width="188" height="48" rx="6" fill="#fff0eb">
    </rect>
    <text x="1394" y="619" fill="#c44d32" font-size="24" font-weight="700" text-anchor="middle">
     
     
     
     下降 76.8%
