  <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
   <desc>
    
    
    
    在两种模式都严格通过的 41 组配对样本中，Native 的轮次、工具调用、耗时、Token 和成本均显著下降。
   </desc>
   <rect width="1600" height="900" fill="#f7f8fa">
   </rect>
   <text x="100" y="90" fill="#18212b" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="700">
    
    
    
    Native 用更少的执行资源完成同一批任务
   </text>
   <text x="100" y="140" fill="#667085" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23">
    
    
    
    仅统计两种模式都严格通过的 41 组配对样本，Classic 归一化为 100%
   </text>
   <rect x="1130" y="80" width="24" height="24" rx="4" fill="#d7dce2">
   </rect>
   <text x="1168" y="101" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">
    
    
    
    Classic
   </text>
   <rect x="1305" y="80" width="24" height="24" rx="4" fill="#148a85">
   </rect>
   <text x="1343" y="101" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">
    
    
    
    Native
   </text>
